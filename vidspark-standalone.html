<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VidSpark · 单文件 HTML（原版界面：WebGL 慧眼 + GSAP 气泡导航）</title>
<style>
  :root{
    --bg:#09090b; --card:#18181b; --card2:#1f1f23; --border:#27272a;
    --fg:#fafafa; --muted:#a1a1aa; --red:#ef4444; --red-soft:#f87171;
    --radius:14px; --shadow:0 6px 24px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}

  /* ---------- 顶部导航 ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(9,9,11,.85);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px}
  .brand .dot{width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red)}
  .tabs{display:flex;gap:4px;flex-wrap:wrap}
  .tab{padding:7px 14px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:14px;transition:.15s}
  .tab:hover{color:var(--fg);background:var(--card)}
  .tab.active{color:#fff;background:var(--red);border-color:var(--red)}
  .search{flex:1;min-width:160px;display:flex}
  .search input{width:100%;padding:9px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--fg);outline:none;font-size:14px}
  .search input:focus{border-color:var(--red)}

  main{padding:20px 16px 90px;max-width:1200px;margin:0 auto}
  .page-title{font-size:22px;font-weight:800;margin:0 0 4px}
  .page-sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  .section-h{font-size:16px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}

  /* ---------- 视频卡 ---------- */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;position:relative;transition:.18s;cursor:pointer}
  .card:hover{transform:translateY(-4px);border-color:#3f3f46;box-shadow:var(--shadow)}
  .thumb{height:150px;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px}
  .thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.7);padding:2px 7px;border-radius:6px;font-size:12px}
  .thumb .cat{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:999px;font-size:11px}
  .badge{position:absolute;left:8px;top:8px;background:var(--red);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
  .card .meta{padding:11px 12px}
  .card .ttl{font-weight:700;font-size:14px;line-height:1.35;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .sub{color:var(--muted);font-size:12.5px}
  .card .actions{position:absolute;right:10px;bottom:10px;display:none;gap:6px}
  .card:hover .actions{display:flex}
  .mini{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:rgba(24,24,27,.92);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.15s}
  .mini:hover{background:var(--red);border-color:var(--red);transform:scale(1.08)}
  .mini.on{background:var(--red);border-color:var(--red)}

  /* ---------- 慧眼 hero（WebGL） ---------- */
  .hero{position:relative;border-radius:18px;overflow:hidden;margin-bottom:24px;border:1px solid var(--border);
    background:radial-gradient(120% 140% at 50% -20%, rgba(239,68,68,.18), transparent 60%),linear-gradient(180deg,#101013,#0b0b0e);
    padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .hero canvas{width:300px;height:300px;cursor:crosshair;display:block}
  .hero h1{margin:4px 0 0;font-size:26px}
  .hero p{margin:0;color:var(--muted);font-size:13px;text-align:center}
  .hero .cta{margin-top:6px;display:flex;gap:10px}
  .btn{border:1px solid var(--border);background:var(--card);color:#fff;padding:9px 18px;border-radius:999px;font-size:14px;transition:.15s}
  .btn:hover{border-color:#3f3f46}
  .btn.primary{background:var(--red);border-color:var(--red)}
  .btn.primary:hover{background:#dc2626}

  .catbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:13px;transition:.15s}
  .chip:hover{color:#fff}
  .chip.active{background:#fff;color:#111;border-color:#fff;font-weight:700}
  .hist{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .hist .h{color:var(--muted);font-size:12px}
  .hist .tag{background:var(--card);border:1px solid var(--border);padding:4px 10px;border-radius:999px;font-size:12px;display:flex;gap:6px;align-items:center}
  .hist .tag b{cursor:pointer}
  .hist .tag .x{cursor:pointer;color:var(--muted);font-size:13px}
  .hist .tag .x:hover{color:var(--red)}

  /* ---------- 上传表单 ---------- */
  .form{max-width:640px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .field input[type=text],.field textarea,.field select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:#fff;outline:none;font-size:14px}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--red)}
  .drop{border:2px dashed var(--border);border-radius:12px;padding:26px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s;background:var(--card2)}
  .drop:hover{border-color:var(--red);color:#fff}
  .drop.drag{border-color:var(--red);background:rgba(239,68,68,.08)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>.field{flex:1;min-width:160px}
  .preview{margin-top:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .preview .pv{width:120px;height:70px;border-radius:10px;background-size:cover;background-position:center;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;overflow:hidden}
  .preview .pv img{width:100%;height:100%;object-fit:cover}
  .err{color:var(--red-soft);font-size:12.5px;margin-top:6px;min-height:16px}
  .prog{height:8px;background:var(--card2);border-radius:999px;overflow:hidden;margin-top:10px;display:none}
  .prog>i{display:block;height:100%;width:0;background:var(--red);transition:width .1s}

  /* ---------- 动态 ---------- */
  .feed-item{display:flex;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;align-items:center}
  .feed-item .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#ef4444,#f59e0b);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
  .feed-item .tx{flex:1;min-width:0}
  .feed-item .tx .u{font-weight:700;font-size:14px}
  .feed-item .tx .c{color:var(--muted);font-size:13px}
  .feed-item .tx .tgt{margin-top:6px;display:inline-block;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
  .feed-item .tx .tgt:hover{border-color:var(--red)}

  /* ---------- 播放页 ---------- */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;overflow:auto}
  .modal-mask.show{display:block}
  .player{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .player .frame{position:absolute;inset:0;opacity:.85}
  .player .center{position:relative;z-index:3;text-align:center}
  .player .playbtn{width:64px;height:64px;border-radius:50%;background:rgba(239,68,68,.92);border:none;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto}
  .player .bar{position:absolute;left:0;right:0;bottom:0;z-index:4;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);padding:18px 14px 10px}
  .player .track{height:5px;background:rgba(255,255,255,.25);border-radius:999px;cursor:pointer}
  .player .track>i{display:block;height:100%;width:0;background:var(--red);border-radius:999px}
  .player .time{color:#fff;font-size:12px;margin-top:6px;display:flex;justify-content:space-between}
  .dm-layer{position:absolute;inset:0;overflow:hidden;z-index:2;pointer-events:none}
  .dm{position:absolute;top:0;white-space:nowrap;color:#fff;text-shadow:0 1px 2px #000;font-size:14px;z-index:2;will-change:transform}
  .detail-wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
  .detail-head{font-size:18px;font-weight:800;margin:14px 0 6px}
  .detail-author{display:flex;align-items:center;gap:10px;margin:10px 0;color:var(--muted);font-size:14px}
  .follow{border:1px solid var(--red);color:var(--red);background:transparent;padding:5px 14px;border-radius:999px;font-size:13px}
  .follow.on{background:var(--red);color:#fff}
  .acts{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
  .act{border:1px solid var(--border);background:var(--card);color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;display:flex;align-items:center;gap:7px;transition:.15s}
  .act:hover{border-color:#3f3f46}
  .act.on{background:var(--red);border-color:var(--red)}
  .comments{margin-top:18px}
  .cmt-form{display:flex;gap:8px;margin-bottom:14px}
  .cmt-form input{flex:1;padding:9px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:#fff;outline:none}
  .cmt{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
  .cmt .av2{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#ec4899);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
  .cmt .body .name{font-size:13px;font-weight:700}
  .cmt .body .txt{font-size:14px;color:#e4e4e7}
  .rel{margin-top:22px}
  .back{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;align-items:center;gap:10px}
  .back button{background:var(--card);border:1px solid var(--border);color:#fff;border-radius:8px;padding:6px 12px}

  /* ============ BubbleMenu（移植自 react-bits，GSAP 动画） ============ */
  .bubble-menu{left:0;right:0;top:2em;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 2em;pointer-events:none;z-index:99}
  .bubble-menu.fixed{position:fixed}
  .bubble-menu.absolute{position:absolute}
  .bubble-menu .bubble{--bubble-size:48px;width:var(--bubble-size);height:var(--bubble-size);border-radius:50%;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.12);display:inline-flex;align-items:center;justify-content:center;pointer-events:auto}
  .bubble-menu .logo-bubble,.bubble-menu .toggle-bubble{will-change:transform}
  .bubble-menu .logo-bubble{width:auto;min-height:var(--bubble-size);height:var(--bubble-size);padding:0 16px;border-radius:calc(var(--bubble-size)/2);gap:8px}
  .bubble-menu .toggle-bubble{width:var(--bubble-size);height:var(--bubble-size)}
  .bubble-menu .logo-content{display:inline-flex;align-items:center;justify-content:center;width:120px;height:100%}
  .bubble-menu .menu-btn{border:none;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
  .bubble-menu .menu-line{width:26px;height:2px;background:#111;border-radius:2px;display:block;margin:0 auto;transition:transform .3s ease,opacity .3s ease;transform-origin:center}
  .bubble-menu .menu-line+.menu-line{margin-top:6px}
  .bubble-menu .menu-btn.open .menu-line:first-child{transform:translateY(4px) rotate(45deg)}
  .bubble-menu .menu-btn.open .menu-line:last-child{transform:translateY(-4px) rotate(-45deg)}
  @media(min-width:768px){.bubble-menu .bubble{--bubble-size:56px}.bubble-menu .logo-bubble{padding:0 16px}}
  .bubble-menu-items{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:98;background:rgba(9,9,11,.6);backdrop-filter:blur(4px)}
  .bubble-menu-items.fixed{position:fixed}
  .bubble-menu-items .pill-list{list-style:none;margin:0 auto;padding:0 24px;display:flex;flex-wrap:wrap;gap:0;row-gap:4px;width:100%;max-width:1600px;pointer-events:auto;justify-content:stretch}
  .bubble-menu-items .pill-col{display:flex;justify-content:center;align-items:stretch;flex:0 0 calc(100%/3);box-sizing:border-box}
  .bubble-menu-items .pill-col:nth-child(4):nth-last-child(2){margin-left:calc(100%/6)}
  .bubble-menu-items .pill-col:nth-child(4):last-child{margin-left:calc(100%/3)}
  .bubble-menu-items .pill-link{--pill-bg:#ffffff;--pill-color:#111;--pill-border:rgba(0,0,0,.12);--item-rot:0deg;--pill-min-h:160px;--hover-bg:#f3f4f6;--hover-color:#111;width:100%;min-height:var(--pill-min-h);padding:clamp(1.5rem,3vw,8rem) 0;font-size:clamp(1.5rem,4vw,4rem);font-weight:400;line-height:0;border-radius:999px;background:var(--pill-bg);color:var(--pill-color);text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;position:relative;transition:background .3s ease,color .3s ease;will-change:transform;box-sizing:border-box;white-space:nowrap;overflow:hidden;height:10px}
  @media(min-width:900px){.bubble-menu-items .pill-link{transform:rotate(var(--item-rot))}}
  .bubble-menu-items .pill-link .pill-label{display:inline-block;will-change:transform,opacity;height:1.2em;line-height:1.2}
  @media(max-width:899px){.bubble-menu-items{align-items:flex-start;padding-top:120px}.bubble-menu-items .pill-list{row-gap:16px}.bubble-menu-items .pill-col{flex:0 0 100%;margin-left:0!important;overflow:visible}.bubble-menu-items .pill-link{font-size:clamp(1.2rem,3vw,4rem);padding:clamp(1rem,2vw,2rem) 0;min-height:80px}}
  /* 原工程 .vs-bubble 定位（避开移动端底栏） */
  .vs-bubble{position:fixed;top:auto;bottom:1.5rem;left:auto;right:1.5rem;width:auto;padding:0;justify-content:flex-end;gap:12px;z-index:100}
  @media(max-width:767px){.vs-bubble{bottom:4.75rem}}

  /* ---------- 移动端底部导航 ---------- */
  .bottom-nav{display:none}
  @media(max-width:767px){
    .tabs{display:none}
    .bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;justify-content:space-around;background:rgba(9,9,11,.95);border-top:1px solid var(--border);padding:8px 0;backdrop-filter:blur(10px)}
    .bottom-nav a{flex:1;text-align:center;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
    .bottom-nav a.active{color:var(--red)}
    .bottom-nav a .i{font-size:18px}
    main{padding-bottom:80px}
  }
  .empty{text-align:center;color:var(--muted);padding:50px 0}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 18px;border-radius:999px;font-size:14px;z-index:300;opacity:0;transition:.25s;box-shadow:var(--shadow)}
  .toast.show{opacity:1}
  .num{color:var(--muted);font-size:12.5px}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span>VidSpark</div>
  <nav class="tabs" id="tabs">
    <button class="tab" data-go="home">首页</button>
    <button class="tab" data-go="popular">热门</button>
    <button class="tab" data-go="categories">分区</button>
    <button class="tab" data-go="upload">上传</button>
    <button class="tab" data-go="feed">动态</button>
  </nav>
  <div class="search"><input id="searchInput" placeholder="搜索标题 / UP主 / 标签… (回车)" /></div>
</header>

<main id="view"></main>

<!-- ============ 悬浮气泡导航（移植自 react-bits BubbleMenu + GSAP） ============ -->
<nav class="bubble-menu fixed vs-bubble" aria-label="Main navigation">
  <div class="bubble logo-bubble" id="bmLogo" aria-label="Logo" style="display:none" onclick="menuLogo()">
    <span class="logo-content"><span style="font-weight:800;color:#ef4444">VidSpark</span></span>
  </div>
  <button type="button" class="bubble toggle-bubble menu-btn" id="bmToggle" aria-label="Toggle menu" aria-pressed="false">
    <span class="menu-line"></span><span class="menu-line short"></span>
  </button>
</nav>
<div class="bubble-menu-items fixed" id="bmOverlay" style="display:none">
  <ul class="pill-list" role="menu">
    <li class="pill-col"><a class="pill-link" href="#" style="--item-rot:-8deg;--pill-bg:#27272a;--pill-color:#fafafa;--hover-bg:#ef4444;--hover-color:#fff" onclick="menuGo('home',event)"><span class="pill-label">首页</span></a></li>
    <li class="pill-col"><a class="pill-link" href="#" style="--item-rot:8deg;--pill-bg:#27272a;--pill-color:#fafafa;--hover-bg:#f97316;--hover-color:#fff" onclick="menuGo('popular',event)"><span class="pill-label">热门</span></a></li>
    <li class="pill-col"><a class="pill-link" href="#" style="--item-rot:8deg;--pill-bg:#27272a;--pill-color:#fafafa;--hover-bg:#8b5cf6;--hover-color:#fff" onclick="menuGo('categories',event)"><span class="pill-label">分区</span></a></li>
    <li class="pill-col"><a class="pill-link" href="#" style="--item-rot:8deg;--pill-bg:#27272a;--pill-color:#fafafa;--hover-bg:#22c55e;--hover-color:#fff" onclick="menuGo('upload',event)"><span class="pill-label">上传</span></a></li>
    <li class="pill-col"><a class="pill-link" href="#" style="--item-rot:-8deg;--pill-bg:#27272a;--pill-color:#fafafa;--hover-bg:#3b82f6;--hover-color:#fff" onclick="menuGo('feed',event)"><span class="pill-label">动态</span></a></li>
  </ul>
</div>

<nav class="bottom-nav" id="bottomNav">
  <a data-go="home"><span class="i">🏠</span>首页</a>
  <a data-go="popular"><span class="i">🔥</span>热门</a>
  <a data-go="categories"><span class="i">🗂</span>分区</a>
  <a data-go="upload"><span class="i">⬆️</span>上传</a>
  <a data-go="feed"><span class="i">📡</span>动态</a>
</nav>

<div class="modal-mask" id="detailMask"><div class="detail-wrap" id="detailWrap"></div></div>
<div class="toast" id="toast"></div>

<!-- GSAP（原 BubbleMenu 依赖；离线时自动降级为直接显隐） -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ===================== 数据 ===================== */
const CATEGORIES=[{key:'all',name:'全部'},{key:'music',name:'音乐'},{key:'game',name:'游戏'},{key:'knowledge',name:'知识'},{key:'funny',name:'搞笑'},{key:'food',name:'美食'},{key:'life',name:'生活'}];
const COLORS=['#667eea,#764ba2','#f6d365,#fda085','#ff9a9e,#fecfef','#0f2027,#2c5364','#1f4037,#99f2c8','#ee0979,#ff6a00','#11998e,#38ef7d','#ffafbd,#ffc3a0','#36d1dc,#5b86e5','#cc2b5e,#753a88','#f7971e,#ffd200','#8e2de2,#4a00e0'];
function V(id,title,author,views,viewsNum,duration,cat,published,tags){return{id,title,author,views,viewsNum,duration,cover:`linear-gradient(135deg,${COLORS[(id-1)%COLORS.length]})`,category:cat,publishedAt:published,tags:tags||[]};}
let VIDEOS=[
  V(1,'雨夜老城区漫步','城市漫游者','12.4万',124000,'08:24','life','2天前',['治愈','城市','雨']),
  V(2,'30分钟吉他指弹纯享','弦外之音','8.7万',87000,'30:12','music','5天前',['吉他','纯音乐','指弹']),
  V(3,'猫咪大战吸尘器','喵星观察局','202万',2020000,'03:41','funny','1天前',['猫','搞笑','萌宠']),

function hexToVec3(hex){const h=hex.replace('#','');return[parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255];}
function generateNoiseTexture(size){
  const data=new Uint8Array(size*size*4);
  function hash(x,y,s){let n=x*374761393+y*668265263+s*1274126177;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296;}

    const v00=hash(((ix%w)+w)%w,((iy%w)+w)%w,seed),v10=hash((((ix+1)%w)+w)%w,((iy%w)+w)%w,seed),v01=hash(((ix%w)+w)%w,(((iy+1)%w)+w)%w,seed),v11=hash((((ix+1)%w)+w)%w,(((iy+1)%w)+w)%w,seed);

const EE_VERT=`attribute vec2 uv;attribute vec2 position;varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,0.0,1.0);}`;
const EE_FRAG=`precision highp float;uniform float uTime;uniform vec3 uResolution;uniform sampler2D uNoiseTexture;uniform float uPupilSize;uniform float uIrisWidth;uniform float uGlowIntensity;uniform float uIntensity;uniform float uScale;uniform float uNoiseScale;uniform vec2 uMouse;uniform float uPupilFollow;uniform float uFlameSpeed;uniform vec3 uEyeColor;uniform vec3 uBgColor;

function initEvilEye(canvas){
  if(!canvas)return;

  const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,256,256,0,gl.RGBA,gl.UNSIGNED_BYTE,noiseData);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.uniform1i(gl.getUniformLocation(prog,'uNoiseTexture'),0);
  const U=n=>gl.getUniformLocation(prog,n);
  gl.uniform1f(U('uPupilSize'),0.6);gl.uniform1f(U('uIrisWidth'),0.25);gl.uniform1f(U('uGlowIntensity'),0.35);
  gl.uniform1f(U('uIntensity'),1.5);gl.uniform1f(U('uScale'),0.8);gl.uniform1f(U('uNoiseScale'),1.0);
  gl.uniform1f(U('uPupilFollow'),1.0);gl.uniform1f(U('uFlameSpeed'),1.0);
  gl.uniform3fv(U('uEyeColor'),hexToVec3('#FF6F37'));gl.uniform3fv(U('uBgColor'),hexToVec3('#000000'));
  const mouse={x:0,y:0,tx:0,ty:0};
  canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouse.tx=((e.clientX-r.left)/r.width)*2-1;mouse.ty=-(((e.clientY-r.top)/r.height)*2-1);});
  canvas.addEventListener('mouseleave',()=>{mouse.tx=0;mouse.ty=0;});
  function resize(){const dpr=Math.min(window.devicePixelRatio||1,2);const w=canvas.clientWidth||300,h=canvas.clientHeight||300;canvas.width=w*dpr;canvas.height=h*dpr;gl.viewport(0,0,canvas.width,canvas.height);gl.uniform3f(U('uResolution'),canvas.width,canvas.height,canvas.width/canvas.height);}
  window.addEventListener('resize',resize);resize();
  function update(t){requestAnimationFrame(update);mouse.x+=(mouse.tx-mouse.x)*0.05;mouse.y+=(mouse.ty-mouse.y)*0.05;gl.uniform1f(U('uTime'),t*0.001);gl.uniform2f(U('uMouse'),mouse.x,mouse.y);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,3);}
  requestAnimationFrame(update);
}

/* ===================== 交互辅助 ===================== */
function toggle(o,k){if(o[k])delete o[k];else o[k]=1;}
function syncCardMarks(){document.querySelectorAll('[data-like]').forEach(b=>{const on=!!liked[b.dataset.like];b.className='mini '+(on?'on':'');b.textContent=on?'❤️':'🤍';});document.querySelectorAll('[data-fav]').forEach(b=>{const on=!!faved[b.dataset.fav];b.className='mini '+(on?'on':'');b.textContent=on?'⭐':'☆';});}
function bindCardClicks(root){
  root.querySelectorAll('[data-play]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-like],[data-fav]'))return;openDetail(el.dataset.play);});
  root.querySelectorAll('[data-like]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggle(liked,b.dataset.like);const on=!!liked[b.dataset.like];b.className='mini '+(on?'on':'');b.textContent=on?'❤️':'🤍';toast(on?'已点赞 ❤️':'已取消点赞');saveAll();});
  root.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggle(faved,b.dataset.fav);const on=!!faved[b.dataset.fav];b.className='mini '+(on?'on':'');b.textContent=on?'⭐':'☆';toast(on?'已收藏 ⭐':'已取消收藏');saveAll();});
}
function bindCategories(){
  view.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;renderCategories();});
  view.querySelectorAll('[data-hist]').forEach(t=>t.onclick=()=>{state.query=t.dataset.hist;$('#searchInput').value=t.dataset.hist;renderCategories();});
  view.querySelectorAll('[data-delhist]').forEach(x=>x.onclick=e=>{e.stopPropagation();searchHist=searchHist.filter(h=>h!==x.dataset.delhist);saveAll();renderCategories();});
  view.querySelectorAll('[data-clearhist]').forEach(x=>x.onclick=()=>{searchHist=[];saveAll();renderCategories();});
  bindCardClicks(view);
}

/* ===================== 上传绑定 ===================== */
function bindUpload(){
  const fileIn=$('#file'),drop=$('#drop'),coverIn=$('#coverFile'),coverDrop=$('#coverDrop'),pv=$('#pv'),durIn=$('#dur'),err=$('#err'),prog=$('#prog');
  let videoFile=null,coverURL=null;
  drop.onclick=()=>fileIn.click();coverDrop.onclick=()=>coverIn.click();
  [drop,coverDrop].forEach(d=>{['dragover','dragenter'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('drag');}));['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('drag');}));});
  drop.addEventListener('drop',e=>{if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0]);});
  coverDrop.addEventListener('drop',e=>{if(e.dataTransfer.files[0])handleCover(e.dataTransfer.files[0]);});
  fileIn.onchange=e=>{if(e.target.files[0])handleFile(e.target.files[0]);};
  coverIn.onchange=e=>{if(e.target.files[0])handleCover(e.target.files[0]);};
  function handleFile(f){videoFile=f;err.textContent='';const url=URL.createObjectURL(f);const vid=document.createElement('video');vid.preload='metadata';vid.src=url;vid.onloadedmetadata=()=>{durIn.value=fmt(Math.round(vid.duration));URL.revokeObjectURL(url);};drop.innerHTML='🎬 '+esc(f.name);}
  function handleCover(f){coverURL=URL.createObjectURL(f);const img=new Image();img.onload=()=>{pv.innerHTML='';pv.appendChild(img);img.style.cssText='width:100%;height:100%;object-fit:cover';};img.src=coverURL;coverDrop.innerHTML='🖼 '+esc(f.name);}
  $('#publish').onclick=()=>{const title=$('#title').value.trim();if(!title){err.textContent='⚠️ 标题不能为空';return;}if(!videoFile){err.textContent='⚠️ 请先选择视频文件';return;}err.textContent='';prog.style.display='block';const bar=prog.firstElementChild;let p=0;const t=setInterval(()=>{p+=8;bar.style.width=p+'%';if(p>=100){clearInterval(t);const id=Date.now();const newV={id,title,author:$('#author').value.trim()||'我',views:'0',viewsNum:0,duration:durIn.value||'00:00',cover:coverURL?`url(${coverURL}) center/cover`:`linear-gradient(135deg,${COLORS[id%COLORS.length]})`,category:$('#cat').value,publishedAt:'刚刚',tags:$('#tags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),userVideo:true};userVideos.unshift(newV);saveAll();toast('发布成功 🎉');setTimeout(()=>go('home'),600);}},90);};
}

/* ===================== 路由 ===================== */
function go(page,query){
  state.page=page;state.query=(query!==undefined)?query:(page==='categories'?state.query:'');
  if(page!=='categories')state.query='';
  $('#detailMask').classList.remove('show');render();window.scrollTo(0,0);
}
function render(){
  ({home:renderHome,popular:renderPopular,categories:renderCategories,upload:renderUpload,feed:renderFeed}[state.page]||renderHome)();
  bindCardClicks(view);
  document.querySelectorAll('.tab,.bottom-nav a').forEach(t=>t.classList.toggle('active',t.dataset.go===state.page));
}

/* ===================== BubbleMenu 控制器（GSAP 移植） ===================== */
let menuOpen=false,showOverlayBM=false;
const bmOverlay=$('#bmOverlay'),bmBubbles=[...bmOverlay.querySelectorAll('.pill-link')],bmLabels=[...bmOverlay.querySelectorAll('.pill-label')],bmToggle=$('#bmToggle'),bmLogo=$('#bmLogo');
const BM_ROT=[-8,8,8,8,-8];
function bmOpen(){
  menuOpen=true;showOverlayBM=true;bmLogo.style.display='inline-flex';bmToggle.classList.add('open');bmToggle.setAttribute('aria-pressed','true');
  if(window.gsap){
    gsap.set(bmOverlay,{display:'flex'});gsap.killTweensOf([...bmBubbles,...bmLabels]);
    gsap.set(bmBubbles,{scale:0,transformOrigin:'50% 50%'});gsap.set(bmLabels,{y:24,autoAlpha:0});
    bmBubbles.forEach((b,i)=>{const delay=i*0.12+gsap.utils.random(-0.05,0.05);const tl=gsap.timeline({delay});
      tl.to(b,{scale:1,duration:0.5,ease:'back.out(1.5)'});
      if(bmLabels[i])tl.to(bmLabels[i],{y:0,autoAlpha:1,duration:0.5,ease:'power3.out'},'-='+(0.5*0.9));});
  }else{bmOverlay.style.display='flex';bmBubbles.forEach(b=>b.style.transform='scale(1)');bmLabels.forEach(l=>{l.style.opacity=1;l.style.transform='none';});}
}
function bmClose(){
  menuOpen=false;bmToggle.classList.remove('open');bmToggle.setAttribute('aria-pressed','false');bmLogo.style.display='none';
  if(window.gsap){
    gsap.killTweensOf([...bmBubbles,...bmLabels]);
    gsap.to(bmLabels,{y:24,autoAlpha:0,duration:0.2,ease:'power3.in'});
    gsap.to(bmBubbles,{scale:0,duration:0.2,ease:'power3.in',onComplete:()=>{bmOverlay.style.display='none';showOverlayBM=false;}});
  }else{bmOverlay.style.display='none';}
}
function menuGo(page,e){e.preventDefault();go(page);bmClose();}
function menuLogo(){go('home');bmClose();}
bmToggle.onclick=()=>{menuOpen?bmClose():bmOpen();};
bmOverlay.onclick=()=>bmClose();
window.addEventListener('resize',()=>{if(menuOpen){const desk=window.innerWidth>=900;bmBubbles.forEach((b,i)=>{const r=desk?(BM_ROT[i]||0):0;if(window.gsap)gsap.set(b,{rotation:r});else b.style.transform=`scale(1) rotate(${r}deg)`;});}});

/* ===================== 全局事件 ===================== */
document.addEventListener('click',e=>{
  const goEl=e.target.closest('[data-go]');if(goEl){go(goEl.dataset.go);return;}
  const pht=e.target.closest('[data-play-title]');if(pht){const v=allVideos().find(x=>x.title===pht.dataset.playTitle);if(v)openDetail(v.id);return;}
});
document.querySelectorAll('.tabs .tab').forEach(t=>t.onclick=()=>go(t.dataset.go));
document.querySelectorAll('.bottom-nav a').forEach(t=>t.onclick=()=>go(t.dataset.go));
$('#searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.trim();if(q){searchHist=[q,...searchHist.filter(h=>h!==q)].slice(0,8);saveAll();}go('categories',q);}});

/* ===================== 启动 ===================== */
go('home');
</script>
